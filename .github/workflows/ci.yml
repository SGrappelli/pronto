name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # Migration rules (every new table has RLS + an explicit GRANT, no default privileges).
      # The live-database checks inside skip themselves unless DB_GRANTS_TEST_URL is set.
      - name: Run migration checks
        run: npm test

      # Unit tests (Vitest): the owner-chat link token, the Telegram/Viber webhooks and the link route.
      - name: Run unit tests
        run: npm run test:unit
        env:
          TELEGRAM_WEBHOOK_SECRET: ci-webhook-secret

      - name: Build
        run: npm run build
        env:
          # Minimal stubs so Next.js can build without a real Supabase project
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_DEPLOYMENT_MODE: selfhosted
          CRON_SECRET: ci-secret
